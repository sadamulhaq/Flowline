name: Flowline UI Tests
on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - 'packages/e2e-tests/**'
  #     - 'packages/backend/**'
  #     - 'packages/web/**'
  #     - '!packages/backend/src/apps/**'
  workflow_dispatch:

env:
  ENCRYPTION_KEY: sample_encryption_key
  WEBHOOK_SECRET_KEY: sample_webhook_secret_key
  APP_SECRET_KEY: sample_app_secret_key
  POSTGRES_HOST: localhost
  POSTGRES_DATABASE: flowline
  POSTGRES_PORT: 5432
  POSTGRES_USERNAME: flowline_user
  POSTGRES_PASSWORD: flowline_password
  REDIS_HOST: localhost
  APP_ENV: production

jobs:
  test:
    timeout-minutes: 60
    runs-on:
      - ubuntu-latest
    services:
      postgres:
        image: postgres:14.5-alpine
        env:
          POSTGRES_DB: flowline
          POSTGRES_USER: flowline_user
          POSTGRES_PASSWORD: flowline_password
        options: >-
          --health-cmd "pg_isready -U flowline_user -d flowline"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7.0.4-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v4
        with:
          node-version: '22.15.0'
          cache: 'yarn'
          cache-dependency-path: |
            packages/backend/yarn.lock
            packages/web/yarn.lock
            packages/e2e-tests/yarn.lock
      - name: Install backend dependencies
        run: yarn --frozen-lockfile
        working-directory: ./packages/backend
      - name: Install web dependencies
        run: yarn --frozen-lockfile
        working-directory: ./packages/web
      - name: Install e2e-tests dependencies
        run: yarn --frozen-lockfile
        working-directory: ./packages/e2e-tests
      - name: Get installed Playwright version
        id: playwright-version
        run: echo "PLAYWRIGHT_VERSION=$(node -e "console.log(require('./package.json').devDependencies['@playwright/test'])")" >> $GITHUB_ENV
        working-directory: ./packages/e2e-tests
      - name: Cache playwright binaries
        uses: actions/cache@v3
        id: playwright-cache
        with:
          path: |
            ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ env.PLAYWRIGHT_VERSION }}
      - name: Install Playwright Browsers
        run: yarn playwright install --with-deps
        working-directory: ./packages/e2e-tests
        if: steps.playwright-cache.outputs.cache-hit != 'true'
      - name: Build Flowline web
        run: APP_ENV=test yarn build
        env:
          # Keep this until we clean up warnings in build processes
          CI: false
        working-directory: ./packages/web
      - name: Migrate database
        working-directory: ./packages/backend
        run: yarn db:migrate
      - name: Run Flowline
        run: yarn start &
        working-directory: ./packages/backend
      - name: Run Flowline worker
        run: yarn start:worker &
        working-directory: ./packages/backend
      - name: Setup upterm session
        if: false
        uses: lhotari/action-upterm@v1
        with:
          limit-access-to-actor: true
      - name: Run Playwright tests
        working-directory: ./packages/e2e-tests
        env:
          LOGIN_EMAIL: user@flowline.example
          LOGIN_PASSWORD: sample
          BACKEND_APP_URL: http://localhost:3000
          BASE_URL: http://localhost:3000
          GITHUB_CLIENT_ID: ${{ secrets.E2E_GITHUB_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.E2E_GITHUB_CLIENT_SECRET }}
        run: yarn test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: packages/e2e-tests/test-results
          retention-days: 30
