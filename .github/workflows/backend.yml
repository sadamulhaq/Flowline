name: Flowline Backend Tests
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test:
    timeout-minutes: 60
    runs-on:
      - ubuntu-latest
    services:
      postgres:
        image: postgres:14.5-alpine
        env:
          POSTGRES_DB: flowline_test
          POSTGRES_USER: flowline_test_user
          POSTGRES_PASSWORD: flowline_test_user_password
        options: >-
          --health-cmd "pg_isready -U flowline_test_user -d flowline_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7.0.4-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '22.15.0'
      - name: Install dependencies
        run: yarn
        working-directory: packages/backend
      - name: Copy .env-example.test file to .env.test
        run: cp .env-example.test .env.test
        working-directory: packages/backend
      - name: Run tests
        run: yarn test
        working-directory: packages/backend
